<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; line-height: 1.6;">
<div style="max-width: 520px; margin: 0 auto; padding: 24px;">

    <h2 style="margin-bottom: 8px;">Your order <span th:text="${orderNo}">MX-10238</span> was cancelled</h2>

    <p>Hi <span th:text="${name} ?: 'there'">there</span>,</p>

    <p th:if="${cancelledBy == 'ADMIN'}">The shop cancelled this order. You do not pay anything for it.</p>
    <p th:unless="${cancelledBy == 'ADMIN'}">As you asked, this order was cancelled. You do not pay anything for it.</p>

    <div th:replace="~{emails/fragments :: footer}"></div>
</div>
</body>
</html>
