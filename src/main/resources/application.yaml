spring:
  application:
    name: notification-service
  profiles:
    # IntelliJ runs the "dev" profile. The Docker env file sets SPRING_PROFILES_ACTIVE=docker.
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the tables. Hibernate only checks that they match the entities.
      ddl-auto: validate

  config:
    # The event -> template map lives in its own file so it is easy to find.
    import: classpath:notification-events.yaml

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A mail server outage must not mark the whole service as down.
    mail:
      enabled: false

logging:
  pattern:
    # traceId = the X-Request-Id that Nginx adds to every request
    level: "%5p [${spring.application.name},%X{traceId:-}]"

auth:
  token:
    # Same secret as user-service. TODO: replace with the RS256 public key when user-service signs with RS256 (M17).
    secret: ${JWT_SECRET}
  cookie:
    name: access_token

notification:
  exchange: app.events
  email:
    queue: notification.email
    from-address: no-reply@motoxpress.local
    # Shown as the sender name, and available in texts as {brandName}.
    from-name: MotoXpress
  push:
    queue: notification.push
    # true needs the Firebase key file below. Without it, push messages are only written to the log.
    enabled: false
    firebase-credentials-file: /app/secrets/firebase.json
